name: 숙소 최저가 수집

on:
  schedule:
    # 매시 정각(UTC). GitHub 크론은 혼잡하면 수 분~수십 분 밀린다.
    - cron: "0 * * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 의존성 없음 — 표준 라이브러리만 쓴다.
      - name: 요금 수집
        run: python collector/collect.py

      # docs/ 를 main 브랜치에서 그대로 서빙하므로 커밋이 곧 배포다.
      - name: 결과 커밋
        run: |
          git config user.name "hotel-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "요금 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main
            git push
          fi
