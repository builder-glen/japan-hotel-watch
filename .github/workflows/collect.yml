name: 숙소 최저가 수집

on:
  schedule:
    # 매시 정각(UTC). GitHub 크론은 혼잡하면 수 분~수십 분 밀린다.
    - cron: "0 * * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 의존성 없음 — 표준 라이브러리만 쓴다.
      - name: 요금 수집
        run: python collector/collect.py

      # docs/ 를 main 브랜치에서 그대로 서빙하므로 커밋이 곧 배포다.
      - name: 결과 커밋
        run: |
          git config user.name "hotel-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          MSG="요금 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git commit -m "$MSG"

          # 다른 실행이 먼저 푸시했으면 그 위에 우리 결과를 다시 얹는다.
          #   history.jsonl — append-only 이므로 양쪽 줄의 합집합 (앞이 ISO 시각이라 sort 가 곧 시간순)
          #   latest.json   — 스냅샷이므로 방금 수집한 우리 것이 이긴다
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "푸시 경합 — 재시도 $i"
            git fetch origin main
            git reset --soft origin/main
            git show origin/main:docs/data/history.jsonl > /tmp/theirs.jsonl 2>/dev/null || : > /tmp/theirs.jsonl
            sort -u /tmp/theirs.jsonl docs/data/history.jsonl > /tmp/merged.jsonl
            mv /tmp/merged.jsonl docs/data/history.jsonl
            git add docs/data
            git commit -m "$MSG"
            sleep 5
          done
          echo "::error::3회 재시도 후에도 푸시 실패"
          exit 1
